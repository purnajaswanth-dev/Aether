# ==============================================================================
# Aether Context Platform - Render Blueprint Specification
# Target Architecture:
#   - Database: Neon PostgreSQL (configured via DB_URL, DB_USERNAME, DB_PASSWORD)
#   - Backend: Render Web Service (Docker / Spring Boot 3.3.5)
#   - Frontend: Render Static Site (React 18 / Vite on Global CDN)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Aether Backend Service (Spring Boot 3.3.5 Monolith in Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: aether-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon # or frankfurt, ohio, singapore
    healthCheckPath: /actuator/health
    disk:
      name: aether-artifact-storage
      mountPath: /app/data/artifacts
      sizeGB: 10
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon PostgreSQL Connection Settings
      - key: DB_URL
        sync: false # Supply your Neon JDBC connection string in Render Dashboard (e.g. jdbc:postgresql://ep-xyz.neon.tech/neondb?sslmode=require)
      - key: DB_USERNAME
        sync: false # Supply your Neon database username in Render Dashboard
      - key: DB_PASSWORD
        sync: false # Supply your Neon database password in Render Dashboard
      - key: AETHER_STORAGE_LOCAL_PATH
        value: /app/data/artifacts
      - key: AETHER_JWT_SECRET
        generateValue: true
      - key: AETHER_MASTER_KEY
        generateValue: true
      - key: AETHER_CORS_ALLOWED_ORIGINS
        value: "http://localhost:*,http://127.0.0.1:*,https://*.onrender.com"

  # ----------------------------------------------------------------------------
  # 2. Aether Frontend Service (React + Vite SPA on Global CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: aether-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          type: web
          name: aether-backend
          property: host
