# ==============================================================================
# Aether Context Platform - Render Blueprint Specification
# Infrastructure as Code (IaC) for 1-Click Deployment on Render
# Services:
#   1. aether-db: Managed PostgreSQL 16 with pgvector support
#   2. aether-backend: Spring Boot 3.3.5 Dockerized Monolith (MCP Server + RAG + API)
#   3. aether-frontend: Vite + React 18 SPA on Global CDN with SPA Routing
# ==============================================================================

databases:
  - name: aether-db
    databaseName: aether
    user: aether
    plan: starter # Starter plan recommended for persistent storage and pgvector extension
    region: oregon # Render regions: oregon, frankfurt, ohio, singapore
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # 1. Aether Backend Service (Modular Spring Boot Monolith in Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: aether-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    healthCheckPath: /actuator/health
    disk:
      name: aether-artifact-storage
      mountPath: /app/data/artifacts
      sizeGB: 10
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: aether-db
          property: connectionString
      - key: AETHER_STORAGE_LOCAL_PATH
        value: /app/data/artifacts
      - key: AETHER_JWT_SECRET
        generateValue: true
      - key: AETHER_MASTER_KEY
        generateValue: true
      - key: AETHER_CORS_ALLOWED_ORIGINS
        value: "http://localhost:*,http://127.0.0.1:*,https://*.onrender.com"

  # ----------------------------------------------------------------------------
  # 2. Aether Frontend Service (React + Vite SPA served via CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: aether-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          type: web
          name: aether-backend
          property: host
