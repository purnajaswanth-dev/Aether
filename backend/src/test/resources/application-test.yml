spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aether}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:aether}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:aether_dev_password}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

aether:
  security:
    jwt:
      secret: 4f5bd5aethersecretkeyforphaseonefoundationsmustbe256bitslong!
      expiration-ms: 86400000
  storage:
    local-path: ./target/test-data/artifacts

