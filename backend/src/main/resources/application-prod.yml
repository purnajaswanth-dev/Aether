# ==============================================================================
# Aether Production Profile Configuration
# Activated via SPRING_PROFILES_ACTIVE=prod
# Strict enforcement: Requires explicit DB_URL, DB_USERNAME, DB_PASSWORD,
# MIGRATION_DB_USERNAME, MIGRATION_DB_PASSWORD, AETHER_JWT_SECRET, AETHER_MASTER_KEY.
# NO development credential fallbacks are permitted in production!
# ==============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:120000}
      max-lifetime: ${DB_MAX_LIFETIME:240000}
      keepalive-time: ${DB_KEEPALIVE_TIME:60000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:3000}
      pool-name: AetherProdHikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${DB_URL}
    user: ${MIGRATION_DB_USERNAME}
    password: ${MIGRATION_DB_PASSWORD}

aether:
  security:
    jwt:
      secret: ${AETHER_JWT_SECRET}
    master-key: ${AETHER_MASTER_KEY}
  storage:
    local-path: ${AETHER_STORAGE_LOCAL_PATH:/app/data/artifacts}
