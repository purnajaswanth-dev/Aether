# ==============================================================================
# Aether Production Profile Configuration
# Activated via SPRING_PROFILES_ACTIVE=prod
# Strict enforcement: Requires explicit DB_URL, DB_USERNAME, DB_PASSWORD.
# NO development credential fallbacks are permitted in production!
# ==============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:900000}
      connection-test-query: SELECT 1
      pool-name: AetherProdHikariPool

aether:
  security:
    jwt:
      secret: ${AETHER_JWT_SECRET}
  storage:
    local-path: ${AETHER_STORAGE_LOCAL_PATH:/app/data/artifacts}
