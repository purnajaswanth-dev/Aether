spring:
  application:
    name: aether
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/aether}}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:aether}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:aether_dev_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:120000}
      max-lifetime: ${DB_MAX_LIFETIME:240000}
      keepalive-time: ${DB_KEEPALIVE_TIME:60000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:3000}
      pool-name: AetherHikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${spring.datasource.url}
    user: ${MIGRATION_DB_USERNAME:${spring.datasource.username}}
    password: ${MIGRATION_DB_PASSWORD:${spring.datasource.password}}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

aether:
  security:
    jwt:
      secret: ${AETHER_JWT_SECRET:4f5bd5aethersecretkeyforphaseonefoundationsmustbe256bitslong!}
      expiration-ms: ${AETHER_JWT_EXPIRATION_MS:86400000} # 24 hours
    cors:
      allowed-origin-patterns: ${AETHER_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.onrender.com}
  storage:
    local-path: ${AETHER_STORAGE_LOCAL_PATH:${AETHER_STORAGE_PATH:./data/artifacts}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

