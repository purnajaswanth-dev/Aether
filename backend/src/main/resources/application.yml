spring:
  application:
    name: aether
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aether}
    username: ${SPRING_DATASOURCE_USERNAME:aether}
    password: ${SPRING_DATASOURCE_PASSWORD:aether_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

aether:
  security:
    jwt:
      secret: ${AETHER_JWT_SECRET:4f5bd5aethersecretkeyforphaseonefoundationsmustbe256bitslong!}
      expiration-ms: ${AETHER_JWT_EXPIRATION_MS:86400000} # 24 hours
    cors:
      allowed-origin-patterns: ${AETHER_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.onrender.com}
  storage:
    local-path: ${AETHER_STORAGE_LOCAL_PATH:${AETHER_STORAGE_PATH:./data/artifacts}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

